# ============================================================================
# Docker Compose — Vault + Postgres for local development
# ============================================================================
# Usage:
#   docker compose -f infrastructure/vault/docker-compose.yml up -d
#   VAULT_ADDR=http://localhost:8200 bash infrastructure/vault/init.sh
# ============================================================================

version: "3.8"

services:
  vault:
    image: hashicorp/vault:1.17.2
    container_name: afropay-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
      - "8201:8201"
    environment:
      VAULT_ADDR: "http://0.0.0.0:8200"
      VAULT_API_ADDR: "http://0.0.0.0:8200"
      # Dev mode token — ONLY for local dev. Remove for staging/prod.
      # Comment out VAULT_DEV_ROOT_TOKEN_ID and VAULT_DEV_LISTEN_ADDRESS
      # and use the vault.hcl config for staging/prod.
      VAULT_DEV_ROOT_TOKEN_ID: "afropay-dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK   # Required for memory locking (mlock)
    volumes:
      - vault-data:/vault/data
      - vault-logs:/vault/logs
      - ./vault.hcl:/vault/config/vault.hcl:ro
    command: >
      vault server -dev
      -dev-root-token-id=afropay-dev-root-token
      -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postgres with a Vault-compatible superuser for dynamic credential generation
  postgres:
    image: postgres:16-alpine
    container_name: afropay-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: afropay
      POSTGRES_USER: postgres
      # In production use a Docker secret or env file, not a hardcoded value:
      POSTGRES_PASSWORD: "${POSTGRES_ROOT_PASSWORD:-changeme_in_production}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d afropay"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vault-data:
  vault-logs:
  postgres-data:
