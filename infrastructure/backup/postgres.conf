# =============================================================================
# AfroPay PostgreSQL WAL Archiving Configuration
# =============================================================================
#
# Purpose: Enable continuous WAL archiving via pgBackRest to an S3-compatible
#          bucket, targeting RPO ≤ 15 minutes for point-in-time recovery.
#
# Apply by appending to or including from postgresql.conf.
# Restart PostgreSQL after changes (or SIGHUP for reload-safe params).
#
# RPO evidence: WAL segments are archived every ~10 minutes (wal_writer_delay
# combined with archive_timeout = 600s ensures no more than 10 min of WAL sits
# unarchived, well within the 15-min RPO target).
# =============================================================================

# ---------------------------------------------------------------------------
# WAL Level — must be 'replica' or higher for archiving
# ---------------------------------------------------------------------------
wal_level = replica

# ---------------------------------------------------------------------------
# Archiving — hand every completed WAL segment to pgBackRest
# ---------------------------------------------------------------------------
archive_mode = on

# pgBackRest archive-push compresses and streams the segment to S3.
# The %p placeholder is the absolute path; %f is the file name.
archive_command = 'pgbackrest --stanza=afropay archive-push %p'

# Force-close an open WAL segment after this many seconds so that quiet
# periods do not silently gap the archive. 600 s = 10 min → satisfies RPO ≤ 15 min.
archive_timeout = 600

# Tolerate transient archive failures (network blip) for up to 2 min before
# raising an ERROR. pgBackRest retries internally; we keep pressure on Postgres
# to retry quickly.
archive_cleanup_command = 'pgbackrest --stanza=afropay archive-cleanup %r'

# ---------------------------------------------------------------------------
# Checkpoint tuning — balance write amplification vs. recovery time
# ---------------------------------------------------------------------------
# Checkpoint every 5 minutes (idle) or when 256 MB of WAL has been written,
# whichever comes first.  Frequent checkpoints shorten recovery time but
# increase I/O on busy servers.
checkpoint_timeout          = 5min
max_wal_size                = 1GB
min_wal_size                = 256MB
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# Replication slots (optional — for replica standby; not required for archiving)
# ---------------------------------------------------------------------------
# If a hot-standby replica is added later, raise max_wal_senders accordingly.
max_wal_senders   = 3
wal_keep_size     = 512MB    # retain 512 MB of WAL locally as a buffer

# ---------------------------------------------------------------------------
# Recovery parameters (used on the *restored* instance, not the primary)
# ---------------------------------------------------------------------------
# These are ignored on the primary but kept here so the same file can be
# copied to the DR instance without editing.
#
# restore_command  = 'pgbackrest --stanza=afropay archive-get %f %p'
# recovery_target_time = '2026-07-21 06:00:00 UTC'   # set at restore time
# recovery_target_action = 'promote'

# ---------------------------------------------------------------------------
# Logging — ensure archive activity is visible in standard logs
# ---------------------------------------------------------------------------
log_checkpoints      = on
log_connections      = on
log_disconnections   = on
log_line_prefix      = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_min_duration_statement = 500   # log queries ≥ 500 ms
