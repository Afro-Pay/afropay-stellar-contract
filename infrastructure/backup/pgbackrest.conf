# =============================================================================
# pgBackRest Configuration — AfroPay
# =============================================================================
#
# File location (on the Postgres host): /etc/pgbackrest/pgbackrest.conf
#   OR set PGBACKREST_CONFIG env var to point here.
#
# Stanza: afropay
#   Covers all AfroPay Postgres databases: checkpoint_store, escrow_events,
#   reconciliation_runs/reports, webhook_idempotency.
#
# Backup schedule (enforced by external cron / GitHub Actions):
#   Full backup  — every Sunday 02:00 UTC
#   Differential — every day   02:00 UTC (Mon–Sat)
#   WAL archive  — continuous  (archive_timeout = 600 s → RPO ≤ 15 min)
#
# Prerequisites on the Postgres host:
#   apt-get install pgbackrest          # or equivalent
#   aws iam attach-role-policy ...      # or set AWS_* env vars / instance profile
# =============================================================================

# ---------------------------------------------------------------------------
# [global] — settings shared across all stanzas
# ---------------------------------------------------------------------------
[global]

# ---- S3 repository ---------------------------------------------------------
repo1-type            = s3
repo1-s3-bucket       = afropay-db-backups           # set via PGBACKREST_REPO1_S3_BUCKET env var
repo1-s3-region       = us-east-1                    # override with PGBACKREST_REPO1_S3_REGION
repo1-s3-key          = ${PGBACKREST_S3_KEY}         # AWS_ACCESS_KEY_ID  — injected at runtime
repo1-s3-key-secret   = ${PGBACKREST_S3_KEY_SECRET}  # AWS_SECRET_ACCESS_KEY — injected at runtime
# For S3-compatible endpoints (MinIO, Cloudflare R2) uncomment:
# repo1-s3-endpoint   = s3.us-east-1.amazonaws.com

# ---- Retention policy -------------------------------------------------------
# Keep 2 full backups + all differentials since the most recent full.
# Retains enough history for a 30-day point-in-time window.
repo1-retention-full  = 2
repo1-retention-diff  = 14

# ---- Encryption (at rest) ---------------------------------------------------
# AES-256-CBC passphrase stored in AWS Secrets Manager; injected via
# PGBACKREST_REPO1_CIPHER_PASS environment variable at pgbackrest invocation time.
repo1-cipher-type     = aes-256-cbc
repo1-cipher-pass     = ${PGBACKREST_REPO1_CIPHER_PASS}

# ---- Compression -----------------------------------------------------------
compress-type         = lz4      # fast compression, good for WAL throughput
compress-level        = 3

# ---- Parallelism ------------------------------------------------------------
process-max           = 4        # use up to 4 parallel processes for backup/restore

# ---- Logging ----------------------------------------------------------------
log-level-console     = info
log-level-file        = detail
log-path              = /var/log/pgbackrest

# ---- Lock directory ---------------------------------------------------------
lock-path             = /tmp/pgbackrest

# ---------------------------------------------------------------------------
# [global:archive-push]
# ---------------------------------------------------------------------------
[global:archive-push]
# Compress WAL segments before upload; reduces S3 storage cost ~70 %.
compress-type         = lz4
compress-level        = 3
# Queue up to 128 WAL segments in memory during an S3 outage before blocking Postgres.
archive-push-queue-max = 128mb

# ---------------------------------------------------------------------------
# [global:archive-get]
# ---------------------------------------------------------------------------
[global:archive-get]
archive-get-queue-max  = 128mb

# ---------------------------------------------------------------------------
# [afropay] — stanza definition
# ---------------------------------------------------------------------------
[afropay]

# Postgres data directory (adjust if using a custom PGDATA path).
pg1-path              = /var/lib/postgresql/data

# Postgres socket / connection details for backup catalog operations.
# pgBackRest connects as the 'pgbackrest' superuser role (or replication slot user).
pg1-socket-path       = /var/run/postgresql
pg1-port              = 5432
pg1-database          = postgres
pg1-user              = pgbackrest

# ---------------------------------------------------------------------------
# Example invocations (run as the postgres OS user or via sudo):
# ---------------------------------------------------------------------------
#
# Create stanza (first time only):
#   pgbackrest --stanza=afropay stanza-create
#
# Take a full backup:
#   pgbackrest --stanza=afropay backup --type=full
#
# Take a differential backup:
#   pgbackrest --stanza=afropay backup --type=diff
#
# Verify repository integrity:
#   pgbackrest --stanza=afropay check
#
# List available backups and WAL:
#   pgbackrest --stanza=afropay info
#
# Restore to latest:
#   pgbackrest --stanza=afropay restore
#
# Restore to a specific point in time (PITR):
#   pgbackrest --stanza=afropay restore \
#     --target-action=promote \
#     --type=time \
#     --target="2026-07-21 06:00:00 UTC"
#
# See scripts/dr/restore-postgres.sh for the full automated PITR procedure.
