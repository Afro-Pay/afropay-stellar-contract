# =============================================================================
# AfroPay Redis Backup Configuration
# =============================================================================
#
# Purpose: Dual RDB snapshot + Append-Only File (AOF) persistence for Redis,
#          covering idempotency keys, rate-limit counters, and BullMQ job state.
#
# Data stored in Redis (from api/webhooks/idempotency-store.ts, services/queue/):
#   bull:*             — BullMQ job queues (active, waiting, delayed, failed)
#   idempotency:*      — webhook deduplication keys (TTL ~24 h)
#   ratelimit:*        — per-user/per-IP counters (TTL ~1 min–1 h)
#   dlq:*             — dead-letter queue metadata
#
# RPO note: Redis data is soft-state for rate-limit counters (loss is tolerable
# for up to 1 minute) and idempotency keys (loss requires re-checking the
# Postgres webhook_idempotency table as the source of truth).  BullMQ jobs
# with status 'active' at crash time will be re-queued on restart — see the
# BullMQ documentation on stalled job detection.
#
# Usage: copy to /etc/redis/redis.conf (or mount into Docker at /usr/local/etc/redis/redis.conf)
# =============================================================================

# ---------------------------------------------------------------------------
# Network / Auth (placeholders — override in prod via env or secrets manager)
# ---------------------------------------------------------------------------
bind 127.0.0.1 ::1
protected-mode yes
requirepass ""           # set via REDIS_PASSWORD env var / Docker secret

# ---------------------------------------------------------------------------
# RDB Snapshots (point-in-time file-based backup)
# ---------------------------------------------------------------------------
# Save the dataset every N seconds if at least M keys changed.
# Three checkpoints balance durability vs. I/O load:
#
#   save 900 1     — after 15 min if ≥ 1  key changed  (low-write periods)
#   save 300 10    — after  5 min if ≥ 10 keys changed  (normal traffic)
#   save 60  1000  — after  1 min if ≥ 1 000 keys changed (burst)
save 900 1
save 300 10
save 60  1000

# RDB file name and directory
dbfilename dump.rdb
dir /data

# Stop accepting writes if the last RDB save failed (prevents silent data loss).
stop-writes-on-bgsave-error yes

# Compress the RDB file (LZF). Saves ~30 % disk space with minimal CPU cost.
rdbcompression yes

# CRC64 checksum in the RDB footer — detects corruption on load.
rdbchecksum yes

# ---------------------------------------------------------------------------
# Append-Only File (AOF) — per-command durability log
# ---------------------------------------------------------------------------
# AOF provides much finer-grained recovery than RDB alone.
# Combined with RDB, it gives us both fast full-backup loading (RDB) and
# minimal data loss (AOF).
appendonly yes
appendfilename "appendonly.aof"

# Fsync policy:
#   everysec — fsync once per second (default). Trades up to 1 s of data loss
#              for throughput. Appropriate for AfroPay because idempotency keys
#              are the real source-of-truth in Postgres; Redis is a cache layer.
appendfsync everysec

# Avoid fsync during AOF rewrites to prevent latency spikes under heavy write load.
no-appendfsync-on-rewrite yes

# Trigger an AOF rewrite when:
#   - the AOF file is ≥ 64 MB, AND
#   - it has grown by ≥ 100 % since the last rewrite
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load a truncated AOF on startup (handles unclean shutdown gracefully).
aof-use-rdb-preamble yes     # hybrid RDB+AOF format — faster restart

# ---------------------------------------------------------------------------
# Memory management
# ---------------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru    # evict LRU keys when limit reached

# ---------------------------------------------------------------------------
# Replication (for DR standby replica)
# ---------------------------------------------------------------------------
# If a read-replica is provisioned for DR validation:
#   replica-serve-stale-data yes
#   replica-read-only yes
#   repl-diskless-sync yes
#   repl-diskless-sync-delay 5
# Uncomment and set on the replica:
#   replicaof <primary-host> 6379

# ---------------------------------------------------------------------------
# Slow log — operational visibility
# ---------------------------------------------------------------------------
slowlog-log-slower-than 10000   # log commands taking > 10 ms
slowlog-max-len 256

# ---------------------------------------------------------------------------
# Backup validation checklist (automated by docker-compose.redis-dr-test.yml)
# ---------------------------------------------------------------------------
# 1. Copy /data/dump.rdb + /data/appendonly.aof to DR location.
# 2. Start a fresh Redis instance pointing at the copied /data.
# 3. Run: redis-cli DBSIZE and compare against pre-failure count.
# 4. Spot-check idempotency keys: redis-cli KEYS "idempotency:*" | wc -l
# 5. Confirm BullMQ queues are intact: redis-cli LLEN "bull:payment:wait"
