# AfroPay stellar.toml — SEP-1 anchor discovery document.
#
# Served at https://<home-domain>/.well-known/stellar.toml with
# Content-Type: text/plain and CORS enabled (see api/app.ts).
#
# NOTE: AfroPay is currently in its testnet phase (see README deployment
# strategy), so NETWORK_PASSPHRASE is the testnet passphrase and SIGNING_KEY
# is a testnet-only key. Both MUST be rotated for the mainnet launch.
#
# When the API runs locally or in CI (HOME_DOMAIN env override set), the
# server rewrites the endpoint origins and SIGNING_KEY at serve time so the
# published document always matches the running instance.

VERSION = "2.7.0"
NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
