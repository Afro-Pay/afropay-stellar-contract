[package]
name = "afropay-stellar-contract"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "20.5.0", features = ["contract"] }
soroban-sdk-macros = "20.5.0"

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["contract", "testutils"] }

[[bin]]
name = "afropay"
path = "src/bin/afropay.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
