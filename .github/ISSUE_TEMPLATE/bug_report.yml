name: Bug Report
description: Report unexpected behaviour, panics, or incorrect state transitions
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill in as much detail as possible.
        
        > ⚠️ **Security vulnerability?** Do NOT open a public issue. See [SECURITY.md](../../SECURITY.md) for the responsible-disclosure process.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Calling `claim_refund` before the timelock expires returns `Ok(())` instead of `Err(InvalidEscrowState)`."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - "src/contract.rs — RemittanceContract"
        - "src/escrow.rs — Escrow struct / state machine"
        - "src/oracle.rs — Oracle attestation"
        - "src/errors.rs — Error codes"
        - "src/events.rs — Event emission"
        - "contracts/escrow/ — EscrowContract"
        - "contracts/escrow/src/migration.rs — Migration framework"
        - "tests/ — Test suite"
        - "CI / GitHub Actions"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or sequence of operations that triggers the bug.
      render: rust
      placeholder: |
        let env = Env::default();
        // ... setup ...
        let result = contract.claim_refund(&escrow_id);
        assert_eq!(result, Err(RemittanceError::EscrowNotExpired)); // fails
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened? Include panic messages, error codes, or incorrect state.
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      placeholder: "rustc 1.77.0 (output of `rustc --version`)"
    validations:
      required: true

  - type: input
    id: soroban-version
    attributes:
      label: Soroban SDK Version
      placeholder: "20.5.0 (from Cargo.toml)"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context — related issues, PRs, Stellar testnet transaction IDs, etc.
    validations:
      required: false
