name: Escrow Contract Tests

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'src/**'
  push:
    paths:
      - 'contracts/**'
      - 'src/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build contract
        run: |
          cd contracts/escrow
          cargo build --target wasm32-unknown-unknown --release
      
      - name: Run property tests
        run: |
          cd contracts/escrow
          cargo test --features testutils -- --nocapture
      
      - name: Run adversarial tests
        run: |
          cd contracts/escrow
          cargo test adversarial --features testutils -- --nocapture
      
      - name: Run proptest with 100,000 cases
        run: |
          cd contracts/escrow
          PROPTEST_CASES=100000 cargo test --features testutils -- --nocapture

      - name: Run upgrade simulation tests (regression harness — Issue #29)
        # Seeds all 5 escrow states (Pending/Funded/Disputed/Released/Refunded),
        # calls migrate(), and asserts every record's state, amount, and parties
        # are intact.  Also verifies post-migration operations and terminal-state
        # guards.  A broken migrate() function will cause this step to fail with
        # a descriptive assertion error.
        run: |
          cd contracts/escrow
          cargo test --features testutils upgrade -- --nocapture
        timeout-minutes: 5
