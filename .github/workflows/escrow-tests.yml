name: Escrow Contract Tests

on:
  pull_request:
    paths:
      - 'contracts/escrow/**'
  push:
    paths:
      - 'contracts/escrow/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          override: true
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build contract
        run: |
          cd contracts/escrow
          cargo build --target wasm32-unknown-unknown --release
      
      - name: Run property tests
        run: |
          cd contracts/escrow
          cargo test --features testutils -- --nocapture
      
      - name: Run adversarial tests
        run: |
          cd contracts/escrow
          cargo test adversarial --features testutils -- --nocapture
      
      - name: Run proptest with 100,000 cases
        run: |
          cd contracts/escrow
          PROPTEST_CASES=100000 cargo test --features testutils -- --nocapture
